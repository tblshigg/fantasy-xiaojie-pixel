<div class="hero"><img class="pet" src="assets/idle.png" alt="红帽衫像素伙伴"><div><h1>范特西小杰</h1><p>红帽衫、黑刘海、小腮红。陪你完成工作的小小像素伙伴。</p></div></div>
<p>这是智能伙伴的外观与动画素材。对话和工作能力由宿主应用提供。</p>
<a class="button" href="https://chatgpt.com/s/sharepet_6af9c4f76ec481919fca50a0cffb36e1">通过分享链接添加</a>
<a class="button secondary" id="native" href="codex://pets/install?name=%E8%8C%83%E7%89%B9%E8%A5%BF%E5%B0%8F%E6%9D%B0&amp;imageUrl=https%3A%2F%2Fraw.githubusercontent.com%2Ftblshigg%2Ffantasy-xiaojie-pixel%2Fmain%2Fassets%2Ffantasy-xiaojie-v2.png&amp;description=%E5%8F%AF%E7%88%B1%E7%BA%A2%E5%B8%BD%E8%A1%AB%E5%83%8F%E7%B4%A0%E4%BC%99%E4%BC%B4&amp;spriteVersionNumber=2">在支持的桌面应用中安装</a>
