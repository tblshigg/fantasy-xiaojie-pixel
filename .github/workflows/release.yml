name: Publish v1.0.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

concurrency:
  group: publish-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify source, build assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          REPO = "tblshigg/fantasy-xiaojie-pixel"
          TAG = "v1.0.0"
          EXPECTED_MANIFEST = "d1974396ec519b98098080cede57c63e481695032de63943a0a60ddb56838512"
          SHA = os.environ["GH_SHA"]
          assert os.environ["GH_REPO"] == REPO and re.fullmatch(r"[0-9a-f]{40}", SHA)
          base = "https://api.github.com/repos/" + REPO
          headers = {"Accept": "application/vnd.github+json", "User-Agent": "fantasy-xiaojie-release", "X-GitHub-Api-Version": "2022-11-28"}
          allowed_dirs = {"assets", "previews", "sources", "prompts", "metadata", "tools", "docs"}
          allowed_files = {"README.md", "README.en.md", "LICENSE", "NOTICE.md", "CHANGELOG.md", "requirements.txt", "requirements-video.txt", "install.html", ".gitignore", ".gitattributes"}
          source_url = "https://codeload.github.com/" + REPO + "/zip/" + SHA
          with urllib.request.urlopen(urllib.request.Request(source_url, headers={"User-Agent": headers["User-Agent"]}), timeout=90) as response:
              source_bytes = response.read()
          files = {}
          with zipfile.ZipFile(io.BytesIO(source_bytes)) as source:
              for item in source.infolist():
                  if item.is_dir():
                      continue
                  name = item.filename.split("/", 1)[1]
                  parts = name.split("/")
                  if ".." in parts or "__pycache__" in parts or name.endswith(".pyc"):
                      continue
                  if parts[0] in allowed_dirs or name in allowed_files:
                      files[name] = source.read(item)
          lines = "".join(name + "\0" + hashlib.sha256(files[name]).hexdigest() + "\n" for name in sorted(files))
          assert len(files) == 61 and hashlib.sha256(lines.encode()).hexdigest() == EXPECTED_MANIFEST, "Source files differ from the audited v1.0.0 materials."
          archive_buffer = io.BytesIO()
          with zipfile.ZipFile(archive_buffer, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted(files):
                  entry = zipfile.ZipInfo("fantasy-xiaojie-pixel/" + name, date_time=(2026, 11, 16, 0, 0, 0))
                  entry.create_system = 0
                  entry.compress_type = zipfile.ZIP_DEFLATED
                  entry.external_attr = 0o100644 << 16
                  archive.writestr(entry, files[name])
          artifacts = {
              "fantasy-xiaojie-pixel-v1.0.0.zip": archive_buffer.getvalue(),
              "fantasy-xiaojie-v2.png": files["assets/fantasy-xiaojie-v2.png"],
              "fantasy-xiaojie-v1.png": files["assets/fantasy-xiaojie-v1.png"],
              "all-states.gif": files["previews/all-states.gif"],
              "all-states.mp4": files["previews/all-states.mp4"],
          }
          expected = {
              "fantasy-xiaojie-v2.png": "9cc563e1864af7d708d13ce493e1f75a6e27ba5e9020b896a3fa2457a5aa343d",
              "fantasy-xiaojie-v1.png": "f183dedeaa56e7e93797de170b8407c2795c296150bf2e519f1ae9ff8c979ec8",
              "all-states.gif": "e720e01b1b2399cfd3b04f5d3be5c059e17916f70e0c8fb2a968ccc47430991b",
              "all-states.mp4": "e076be7f4b9d2a7b239c03a075740eb9a89f92da63b44c9fc7d5095bda77593d",
          }
          for name, digest in expected.items():
              assert hashlib.sha256(artifacts[name]).hexdigest() == digest, name + " integrity failure"
          checksums = "".join(hashlib.sha256(data).hexdigest() + "  " + name + "\n" for name, data in artifacts.items())
          artifacts["SHA256SUMS.txt"] = checksums.encode()
          if os.environ.get("RELEASE_DRY_RUN") == "1":
              print(json.dumps({"ok": True, "source_files": len(files), "artifacts": {name: {"bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()} for name, data in artifacts.items()}}, indent=2))
              raise SystemExit(0)
          headers["Authorization"] = "Bearer " + os.environ["GH_TOKEN"]

          def api(method, path, payload=None):
              body = None if payload is None else json.dumps(payload, ensure_ascii=False).encode()
              request = urllib.request.Request(base + path, data=body, method=method, headers={**headers, "Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=90) as response:
                  return json.load(response)

          body = (
              "## 范特西小杰 v1.0.0\n\n"
              "红帽衫、大头短腿的可爱像素伙伴，包含 9 组动作和 16 个视线方向。\n\n"
              "### 使用与下载\n\n"
              "- [直接添加伙伴](https://chatgpt.com/s/sharepet_6af9c4f76ec481919fca50a0cffb36e1)\n"
              "- [完整使用与下载教程](https://github.com/" + REPO + "/blob/main/docs/INSTALL.md)\n"
              "- 完整 ZIP：成品、动效、提示词、源图及处理工具。\n"
              "- v2 PNG：完整 73 帧；v1 PNG：57 帧兼容格式。\n"
              "- GIF / MP4：无需安装即可查看效果。\n"
              "- SHA256SUMS.txt：下载后校验文件完整性。\n\n"
              "本项目提供伙伴外观与动画，AI 功能由宿主应用提供。非官方同人创作，采用 MIT License；授权范围见仓库 NOTICE.md。\n"
          )
          try:
              release = api("GET", "/releases/tags/" + TAG)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              release = api("POST", "/releases", {"tag_name": TAG, "target_commitish": SHA, "name": "范特西小杰 v1.0.0", "body": body, "draft": True, "prerelease": False})
          existing = {asset["name"]: asset for asset in release["assets"]}
          for name, data in artifacts.items():
              digest = "sha256:" + hashlib.sha256(data).hexdigest()
              if name in existing:
                  assert existing[name]["size"] == len(data) and existing[name].get("digest") == digest, "Existing release asset differs: " + name
                  continue
              url = "https://uploads.github.com/repos/" + REPO + "/releases/" + str(release["id"]) + "/assets?name=" + urllib.parse.quote(name)
              content_type = "application/zip" if name.endswith(".zip") else "image/png" if name.endswith(".png") else "image/gif" if name.endswith(".gif") else "video/mp4" if name.endswith(".mp4") else "text/plain"
              request = urllib.request.Request(url, data=data, method="POST", headers={**headers, "Content-Type": content_type})
              with urllib.request.urlopen(request, timeout=180) as response:
                  uploaded = json.load(response)
              assert uploaded["size"] == len(data) and uploaded.get("digest") == digest, "Upload integrity failure: " + name
              print("Uploaded", name, len(data))
          release = api("PATCH", "/releases/" + str(release["id"]), {"draft": False, "make_latest": "true", "body": body})
          print("Published", release["html_url"])
          PY
